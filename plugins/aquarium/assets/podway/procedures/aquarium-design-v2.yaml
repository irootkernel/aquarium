      - Read the original user decision linked from candidate-evidence and the ordinary authority.document_acceptance record. If the user rejects the current design outcome, record not-achieved; an explicit replacement of the original goal records superseded. A request for corrections returns to drafting and is not a final rejection. Distinguish these actual decisions from absent acceptance, keep original criterion results truthful and never report achieved against a current explicit rejection or supersession.
      - Read every original workflow criterion, current phase obligation, applicable parent constraint and original artifact directly. Retain one logical report-only Evaluator when supported; a fresh independent replacement uses original evidence, current authority and available public handles without requiring private history. An Executor summary or inherited verdict never replaces evidence.
      - Preserve all actual original criterion rows, global outcome verdict and unmet/unverified counts. The separate checkpoint result assesses the actual current phase obligations; later workflow work may remain unmet without inventing a global pass. Report completeness alone cannot establish correction or application success.
      - Record the complete applicable aquarium.evaluator-assessment/v3 from the independent native Evaluator, check coverage and current candidate applicability, then complete this ordinary Action with current fences. Do not recursively evaluate the report or fabricate native receipts.
      - Missing original criteria, stale targets, unreadable evidence or missing required result or authority evidence prevent applicability. An Evaluator report supplies no effects, clipboard, application, implementation, installation, staging, commit or publication authority.
      - Reuse an existing complete final assessment only when its actual checkpoint coverage, candidate, original criteria, required checks and authority remain applicable. The Coordinator records that applicability without another Evaluator dispatch. Otherwise obtain a fresh independent assessment; never relabel a phase-only report as final or reuse a negative report as pass after correction.
      - Assess the coherent assigned phase from original artifacts, not report fidelity alone. Preserve due obligations, future global gaps and the original negative-result router. Use current native harness agents with available public handles, without private executor or model/configuration qualification.
    items:
      - id: evaluator-assessment
        type: artifact
        prompt: Reference the complete aquarium.evaluator-assessment/v3 report and its exact digest; Podway stores metadata only.
        required: true
        allowed_media_types:
          - application/json
      - id: evaluator-verdict
        type: choice
        prompt: Record the Evaluator verdict.
        required: true
        choices:
          - pass
          - rework
          - evidence-needed
      - id: evaluator-unmet-criteria
        type: integer
        prompt: Count mandatory unmet criteria, including omitted original criteria.
        required: true
        minimum: 0
      - id: evaluator-unverified-criteria
        type: integer
        prompt: Count mandatory unverified criteria, including incomplete compound criteria.
        required: true
        minimum: 0
      - id: evaluator-applicability
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-diagnosis-evaluator-applicability; Podway does not execute or attest this check.
        help: Verify every original criterion and all due phase obligations against direct original evidence, exact current candidate, requirements, checks, authority and available public native handles. Unknown telemetry is not a product gap. Preserve original negative rows and truthful verdicts/counts.
        required: true
        operation_id: aquarium-design-diagnosis-evaluator-applicability
        operation_digest: sha256:14d0db832e2b5992b309c058497f2e9fe6600c1e8f25be615dc5a0f50f64cca1
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: evaluator-summary
        type: text
        prompt: Record all original criterion rows and sources, current phase obligations and parent constraints, outcome gaps, remaining effect authority and proposed correction or evidence owner.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: evaluator-goal-outcome
        type: choice
        prompt: Record the exact original workflow goal outcome from every original criterion and actual artifact.
        required: true
        choices:
          - achieved
          - not-achieved
          - superseded
  confirm-design-assessment-applicability:
    type: decision
    title: Confirm final assessment applicability
    objective: Reject missing original coverage, stale target, wrong attempt and missing required candidate or result evidence.
    prompt: Is the complete final report applicable?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Evaluator report and actual authority.
    options:
      - id: current
        label: Report current
        criteria: The complete report binds the current original requirements and exact target.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-applicability
            field: outcome
            equals: pass
      - id: invalid
        label: Report inapplicable
        criteria: The report must be reassessed on current original evidence.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-applicability
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain current coverage, target and result applicability.
  confirm-application-approval:
    type: decision
    title: Confirm exact current application approval
    objective: Reject changed proposal or target snapshots before semantic passage.
    prompt: Do applied bytes or approved no-change match actual exact user approval?
    evidence_guidance:
      - Read the actual current proposal, exact user approval, pre-write snapshot recheck and applied-byte validation.
    options:
      - id: current
        label: Approval current
        criteria: Actual complete approval and unchanged target verification pass.
        guards:
          - evidence:
              node: apply-documents
              item: application-approval-result
            field: outcome
            equals: pass
      - id: invalid
        label: Approval invalid
        criteria: Missing write authority requires its actual grant. Concurrent edits need reconciliation and affected quality; same-scope new-feature corrections do not need a separate diff approval. Other entrypoints keep exact-diff reapproval.
        guards:
          - evidence:
              node: apply-documents
              item: application-approval-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record actual exact approval and target comparison or gap.
  record-application-approval-gap:
    type: action
    title: Record work correction basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read actual failed or stale application approval, exact current proposal and target snapshots. Preserve all original criteria and require remaining authority for original proposal preparation; no stale approval authorizes writes.
      - Only the exact currently authorized rework operation may return to draft. An earlier different owner requires explicitly authorized manual rework. Preserve original Ouroboros leaf capabilities and all original approval gates.
      - Corrections return through drafting and affected quality. New-feature retains same-scope write authority, preserves concurrent edits and invalidates final content acceptance. Other entrypoints renew exact-diff approval. Evidence-only return verifies unchanged after-images or no-change and never grants another write.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - draft
      - id: semantic-authority
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-application-rework-authority; Podway does not execute or attest this check.
        help: Verify actual current unconsumed authority for the exact rework effect, original criterion and report, target, attempt and owner draft. Preserve actual document approval, clipboard authority, Ouroboros leaf scope, provider and check consumption; negative semantic evidence cannot create authority. Application evidence-only work permits verification of unchanged approved bytes, never a changed diff.
        required: true
        operation_id: aquarium-design-application-rework-authority
        operation_digest: sha256:da4e75109e40ef704151d19aac7e51b73fc0cbac0deed9b39451aa33199ec798
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  confirm-application-approval-gap-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Evaluator report and actual authority.
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-application-approval-gap
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-application-approval-gap
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
