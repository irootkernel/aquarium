schema: podway.procedure/v2
id: aquarium-design-v2
version: "13"
name: Aquarium Design
purpose: Shape one approved project, feature epic, or refactor document set without implementing it.
description: A Podway record of Aquarium context capture, Ouroboros discovery, drafting, challenge, guarded quality review, document-write authority and final content review, document application, and closeout.
goal_tracking: true
node_definitions:
  context-record:
    type: action
    title: Capture design authority
    intent: Bind the workflow to its canonical identity, source authority, scope, and approved provider boundary.
    instructions:
      - Use the invoking design skill to record exact repository, document authority, scope, and approved discovery boundary.
      - Do not implement product behavior, mutate unapproved files, or publish. Staging and committing approved documents require the shared separately authorized task-commit boundary.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: context-summary
        type: text
        prompt: Record canonical identity, source paths and digests, approved operations, exclusions, and evidence gaps.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  discovery-record:
    type: action
    title: Record Ouroboros discovery
    intent: Record bounded requirements and decision evidence returned by approved leaf operations.
    instructions:
      - Use the approved Ouroboros discovery leaf and independently verify its bounded requirements evidence.
      - Discovery does not authorize implementation or applying draft documents.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: discovery-summary
        type: text
        prompt: Record provider operation IDs, adjudicated requirements, decisions, open questions, and bounded source references.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  draft-record:
    type: action
    title: Record the proposed design
    intent: Bind quality review to one exact draft and its unresolved constraints.
    instructions:
      - Draft only the approved design documents and preserve target paths, alternatives, and unresolved constraints.
      - Do not apply the draft or implement source behavior.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: draft-summary
        type: text
        prompt: Record target paths, draft digests, work-unit identity, and unresolved constraints.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  challenge-record:
    type: action
    title: Challenge the proposed design
    intent: Test the current draft against counterarguments, uncertainty, and missing evidence before quality review.
    instructions:
      - Challenge the exact draft with relevant counterarguments and missing evidence without changing source behavior.
      - Return bounded findings to the design owner; do not infer approval.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: counterarguments
        type: list
        prompt: Record the material counterarguments or alternative designs considered.
        required: true
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: uncertainty
        type: text
        prompt: Record material uncertainty, evidence limitations, and what could change the design.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  quality-record:
    type: action
    title: Record Ouroboros quality evidence
    intent: Record the QA result and local adjudication for the current draft.
    instructions:
      - Use the approved quality capability on the exact draft and adjudicate findings against repository authority.
      - A passing record does not authorize document application, staging, commit, or implementation.
      - Preserve the raw QA PASS, REVISE, or FAIL verdict and exact draft identity in quality-summary. A completed locally adjudicable operation records pass; record every unresolved valid issue in its owner count and list.
      - Route content findings to their owner before another QA pass. Artifact FAIL is not operation failure. Failed, missing, or non-adjudicable operation evidence records fail or inconclusive; retry unchanged input only through supported authorized recovery.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: quality-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-quality; Podway does not execute or attest the operation.
        help: The declared operation is "Review the current Aquarium design draft, challenge, authority, and trust claims outside Podway in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: aquarium-design-quality
        operation_digest: sha256:3f51262cfcf3bb213105d52e1f2c41a79308d012001ad0832903e5ba72cefa89
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: quality-summary
        type: text
        prompt: Record QA operation IDs, findings, dispositions, and remaining evidence gaps.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: unresolved-discovery-findings
        type: integer
        prompt: Record the number of unresolved authority, source, or discovery findings.
        required: true
        minimum: 0
      - id: unresolved-draft-findings
        type: integer
        prompt: Record the number of unresolved draft, challenge, or trust-claim findings.
        required: true
        minimum: 0
      - id: discovery-findings
        type: list
        prompt: Record bounded unresolved authority, source, or discovery findings.
        required: false
        required_when:
          - item: unresolved-discovery-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: draft-findings
        type: list
        prompt: Record bounded unresolved draft, challenge, or trust-claim findings.
        required: false
        required_when:
          - item: unresolved-draft-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: quality-observations
        type: list
        prompt: Record failure or inconclusive quality-operation observations.
        required: false
        required_when:
          - item: quality-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  quality-decision:
    type: decision
    title: Evaluate design quality
    objective: Route each complete quality result to the phase that owns its correction.
    prompt: Is the current draft ready for document-write authority and final content review?
    evidence_guidance:
      - Read the draft identity, Ouroboros QA evidence, local adjudication, and unresolved constraints.
    options:
      - id: passed
        label: Quality passed
        criteria: The quality operation completed with adjudicable output and no unresolved discovery or draft finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-discovery-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-draft-findings
            equals: 0
      - id: discovery-changes
        label: Discovery changes required
        criteria: At least one authority, source, or discovery finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-discovery-findings
            at_least: 1
      - id: draft-changes
        label: Draft changes required
        criteria: No discovery finding remains and at least one draft, challenge, or trust-claim finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-discovery-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-draft-findings
            at_least: 1
      - id: incomplete
        label: Quality review incomplete
        criteria: The quality operation failed, returned no adjudicable output, or is inconclusive.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the decision from current evidence.
  approval-decision:
    type: decision
    title: Confirm document-write authority
    objective: For new-feature, apply within the actual user document scope. Other entrypoints retain exact-diff approval.
    prompt: Does the current entrypoint have its required document-write authority?
    evidence_guidance:
      - For new-feature, verify the actual document scope and current target snapshots. Other entrypoints compare the approved diff with those snapshots.
    options:
      - id: approved
        label: Document-write authority established
        criteria: For new-feature, the invocation or envelope grants the exact document paths and operations; no diff approval is required. Other entrypoints require actual exact-diff approval. Targets have not changed.
      - id: changes-requested
        label: Changes requested
        criteria: The user rejected or changed the proposal, or a target snapshot changed.
    reason:
      required: true
      prompt: Record the user's decision and exact approved boundary.
  application-record:
    type: action
    title: Apply and validate documents
    intent: Record only approved document changes and current validation evidence.
    instructions:
      - For new-feature, apply the QA-reviewed document candidate under authority.document_write, rechecking target.design.targets before writing. Report actual files for user review without a separate diff approval. Other entrypoints apply only the exact user-approved diff. Run current document validation.
      - Do not implement product code, publish, or extend document approval into commit authority. Use the shared separately authorized task-commit boundary when repository policy requires committed delivery input.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
      - Coordinator supplies entrypoint-specific write authority and current snapshots. Recheck before writing. For new-feature, reconcile concurrent edits and repeat affected QA under the same scope; final content acceptance follows application. Other entrypoints renew exact-diff approval for changed content. Evidence-only re-entry verifies current after-images and grants no write.
    items:
      - id: application-summary
        type: text
        prompt: Record applied paths and digests, validation commands and outcomes, and unresolved constraints.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
      - id: application-approval-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-application-approval; Podway does not execute or attest this check.
        help: Verify actual new-feature scoped write authority or other entrypoints exact-diff approval, unchanged target snapshots before writes, matching applied bytes and required validation. Changed content requires affected quality and snapshot verification. New-feature keeps its same-scope write grant and renews final content acceptance after application; other entrypoints renew exact-diff approval. Neither an Executor nor Evaluator verdict grants this authority.
        required: true
        operation_id: aquarium-design-application-approval
        operation_digest: sha256:d8687d25b79001c68b1ced4b61218d0ab37f608b6667ae2edb6429e0a48d5015
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  applied-review:
    type: decision
    title: Review applied design documents
    objective: Keep scoped document application separate from actual final content acceptance.
    prompt: Has the user accepted the current applied new-feature documents?
    evidence_guidance:
      - Show actual scoped new-feature file links, decisions and validation. Bind actual user acceptance to current digests in authority.document_acceptance, never to write authority or Evaluator passage.
      - Route same-scope changes through drafting, QA, application and affected assessment without diff reapproval. Other entrypoints reuse applicable exact-diff acceptance without another question.
      - Before reassess, retain the latest actual user decision in authority.document_acceptance with source user, decision accepted, rejected or superseded, original user reference and reviewed digests.
      - If acceptance was unverified, retain the actual accepted decision and reassess affected final criteria. Reuse unchanged QA, files and acceptance; do not rewrite files or ask again.
      - Carry that decision into the final evidence index across rework. A correction request alone is neither rejection nor supersession.
      - Replace the current decision after a later user decision or correction request; retain the earlier decision only as history.
      - A rejection binds particular file images; do not apply it to revised images. Link the latest user instruction and current digests in the final evidence index.
      - Explicit replacement of the original goal remains semantic evidence until the user changes that direction. Do not infer goal replacement from file digests.
    options:
      - id: accepted
        label: Content accepted
        criteria: Actual current content acceptance and a passing current final assessment are established under the invoking entrypoint contract.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            equals: achieved
          - evidence:
              node: evaluator-design
              item: evaluator-verdict
            equals: pass
          - evidence:
              node: evaluator-design
              item: evaluator-unmet-criteria
            equals: 0
          - evidence:
              node: evaluator-design
              item: evaluator-unverified-criteria
            equals: 0
      - id: changes-requested
        label: Revise applied documents
        criteria: The user requests changes or the accepted applied images changed.
      - id: not-accepted
        label: Finish without content acceptance
        criteria: The current applicable Evaluator records not-achieved or superseded; preserve that negative outcome without claiming acceptance.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            not_equals: achieved
      - id: reassess
        label: Refresh the final assessment
        criteria: Actual acceptance, rejection or goal replacement makes the current final assessment incomplete or outdated. Refresh only affected final criteria, preserving the actual decision and unchanged documents.
    reason:
      required: true
      prompt: Record actual acceptance or requested corrections and the current file digests.
  goal-assessment:
    type: decision
    title: Assess the design goal
    objective: Determine whether the approved document outcome was achieved without implementation.
    prompt: What is the outcome of the current design goal?
    evidence_guidance:
      - Read write authority, applied digests, validation, unresolved constraints and actual content acceptance. For scoped new-feature, review file links and resolve requested corrections before acceptance.
      - Use the current applicable final Evaluator report and fresh original native criterion statuses; every mandatory original criterion and integration obligation must pass.
      - Faithful negative checkpoints, zero provider findings and unsupported manual claims cannot establish whole-goal success.
    options:
      - id: achieved
        label: Goal achieved
        criteria: The documents are applied and all required validation is current. Scoped new-feature also requires actual user acceptance of the applied file digests; changes requested return to drafting before any completion or delivery-input commit.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            equals: achieved
          - evidence:
              node: evaluator-design
              item: evaluator-verdict
            equals: pass
          - evidence:
              node: evaluator-design
              item: evaluator-unmet-criteria
            equals: 0
          - evidence:
              node: evaluator-design
              item: evaluator-unverified-criteria
            equals: 0
      - id: not-achieved
        label: Goal not achieved
        criteria: Required documents, validation, or unresolved constraints remain incomplete.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            equals: not-achieved
      - id: superseded
        label: Goal superseded
        criteria: The desired design outcome has been replaced explicitly.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            equals: superseded
    reason:
      required: true
      prompt: Explain the outcome using current artifact evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  unaccepted-goal-assessment:
    type: decision
    title: Record an unaccepted design outcome
    objective: Record an honest negative outcome without claiming content acceptance.
    prompt: Which outcome is supported by the current applicable Evaluator report?
    evidence_guidance:
      - Preserve rejection, unmet criteria and applied files. The negative entry guard excludes achieved. Positive reassessment returns to applied review and requires actual content acceptance.
    options:
      - id: achieved
        label: Return to applied review
        criteria: The Evaluator supports achievement; actual current content acceptance is required before successful delivery. The negative entry guard prevents this option on the unaccepted path.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            equals: achieved
      - id: not-achieved
        label: Goal not achieved
        criteria: Content was not accepted or required design obligations remain incomplete.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            equals: not-achieved
      - id: superseded
        label: Goal superseded
        criteria: The desired design outcome was explicitly replaced.
        guards:
          - evidence:
              node: evaluator-design
              item: evaluator-goal-outcome
            equals: superseded
    reason:
      required: true
      prompt: Record the actual negative disposition, remaining effects and current file digests.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  closeout-record:
    type: action
    title: Record design closeout
    intent: Record final artifacts, unresolved constraints, residue, commit authority, and publication state.
    instructions:
      - Record the exact applied design artifacts and remaining boundaries without claiming implementation completion.
      - Commit and publication remain separately authorized effects.
    items:
      - id: closeout-summary
        type: text
        prompt: Record final paths and digests, repository residue, commit if required, and publication state.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
  evaluator-discovery-record:
    type: action
    title: Assess the current candidate
    intent: Obtain a retained report-only Evaluator assessment from all original evidence and current phase obligations.
    instructions:
      - Read every original workflow criterion, current phase obligation, applicable parent constraint and original artifact directly. Retain one logical report-only Evaluator when supported; a fresh independent replacement uses original evidence, current authority and available public handles without requiring private history. An Executor summary or inherited verdict never replaces evidence.
      - Preserve all actual original criterion rows, global outcome verdict and unmet/unverified counts. The separate checkpoint result assesses the actual current phase obligations; later workflow work may remain unmet without inventing a global pass. Report completeness alone cannot establish correction or application success.
      - Record the complete applicable aquarium.evaluator-assessment/v3 from the independent native Evaluator, check coverage and current candidate applicability, then complete this ordinary Action with current fences. Do not recursively evaluate the report or fabricate native receipts.
      - Missing original criteria, stale targets, unreadable evidence or missing required result or authority evidence prevent applicability. An Evaluator report supplies no effects, clipboard, application, implementation, installation, staging, commit or publication authority.
      - Assess the coherent assigned phase from original artifacts, not report fidelity alone. Preserve due obligations, future global gaps and the original negative-result router. Use current native harness agents with available public handles, without private executor or model/configuration qualification.
    items:
      - id: evaluator-assessment
        type: artifact
        prompt: Reference the complete aquarium.evaluator-assessment/v3 report and its exact digest; Podway stores metadata only.
        required: true
        allowed_media_types:
          - application/json
      - id: evaluator-verdict
        type: choice
        prompt: Record the Evaluator verdict.
        required: true
        choices:
          - pass
          - rework
          - evidence-needed
      - id: evaluator-unmet-criteria
        type: integer
        prompt: Count mandatory unmet criteria, including omitted original criteria.
        required: true
        minimum: 0
      - id: evaluator-unverified-criteria
        type: integer
        prompt: Count mandatory unverified criteria, including incomplete compound criteria.
        required: true
        minimum: 0
      - id: evaluator-applicability
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-diagnosis-evaluator-applicability; Podway does not execute or attest this check.
        help: Verify every original criterion and all due phase obligations against direct original evidence, exact current candidate, requirements, checks, authority and available public native handles. Unknown telemetry is not a product gap. Preserve original negative rows and truthful verdicts/counts.
        required: true
        operation_id: aquarium-design-diagnosis-evaluator-applicability
        operation_digest: sha256:14d0db832e2b5992b309c058497f2e9fe6600c1e8f25be615dc5a0f50f64cca1
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: evaluator-summary
        type: text
        prompt: Record all original criterion rows and sources, current phase obligations and parent constraints, outcome gaps, remaining effect authority and proposed correction or evidence owner.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: evaluator-checkpoint-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-discovery-checkpoint; Podway does not execute or attest this check.
        help: Verify actual satisfaction of all current discovery phase obligations and applicable parent constraints from direct original evidence and exact candidate bytes, authorized checks and current authority. Preserve the complete original workflow rows, global verdict and remaining unmet/unverified counts; report completeness alone is insufficient.
        required: true
        operation_id: aquarium-design-discovery-checkpoint
        operation_digest: sha256:60e88315e8f394ada6adb39beb1132685bd26b0ec6cd414b6b638649c4088587
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  decide-discovery-assessment:
    type: decision
    title: Evaluate discovery checkpoint
    objective: Is this exact current phase checkpoint ready for its original successor?
    prompt: Is this exact current phase checkpoint ready for its original successor?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Evaluator report and actual authority.
    options:
      - id: passed
        label: Checkpoint passed
        criteria: Current applicability and actual phase obligations are verified; original workflow outcome gaps remain preserved.
        guards:
          - evidence:
              node: evaluator-discovery
              item: evaluator-applicability
            field: outcome
            equals: pass
          - evidence:
              node: evaluator-discovery
              item: evaluator-checkpoint-result
            field: outcome
            equals: pass
      - id: inapplicable
        label: Report inapplicable
        criteria: Current original coverage or candidate applicability requires reassessment.
        guards:
          - evidence:
              node: evaluator-discovery
              item: evaluator-applicability
            field: outcome
            not_equals: pass
      - id: rework
        label: Checkpoint correction required
        criteria: Actual checkpoint obligations failed; retain original outcome and require local correction authority.
        guards:
          - evidence:
              node: evaluator-discovery
              item: evaluator-applicability
            field: outcome
            equals: pass
          - evidence:
              node: evaluator-discovery
              item: evaluator-checkpoint-result
            field: outcome
            equals: fail
      - id: evidence-needed
        label: Checkpoint evidence incomplete
        criteria: Missing or inconclusive phase evidence requires separate local evidence authority.
        guards:
          - evidence:
              node: evaluator-discovery
              item: evaluator-applicability
            field: outcome
            equals: pass
          - evidence:
              node: evaluator-discovery
              item: evaluator-checkpoint-result
            field: outcome
            equals: inconclusive
    reason:
      required: true
      prompt: Record the current original evidence, target, attempt and authority basis.
  record-discovery-rework:
    type: action
    title: Record work correction basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read the actual triggering Evaluator report, original criteria and source attempt. Record exact correction or missing-evidence owner, current target and remaining actual effect authority. A negative verdict grants no effect or renewed provider budget.
      - Only the exact currently authorized rework operation may return to capture-context. An earlier different owner requires explicitly authorized manual rework. Preserve original Ouroboros leaf capabilities and all original approval gates.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - capture-context
      - id: semantic-authority
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-discovery-rework-authority; Podway does not execute or attest this check.
        help: Verify actual current unconsumed authority for the exact rework effect, original criterion and report, target, attempt and owner capture-context. Preserve actual document approval, clipboard authority, Ouroboros leaf scope, provider and check consumption; negative semantic evidence cannot create authority. Application evidence-only work permits verification of unchanged approved bytes, never a changed diff.
        required: true
        operation_id: aquarium-design-discovery-rework-authority
        operation_digest: sha256:85b0a6287dce176f8fc4ad1267e774dd0b05e58de673a964d6cedd55d868ee2b
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  confirm-discovery-rework-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Evaluator report and actual authority.
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-discovery-rework
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
