name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML==6.0.3"
      - run: python -m unittest tests/test_inspect_tools.py tests/test_task_commit_gate.py tests/test_normalize_manifest.py
      - run: ruby tests/validate.rb
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
          src: >-
            plugins/aquarium/skills/dev-setup/scripts/inspect_tools.py
            plugins/aquarium/skills/dev-setup-bundle/scripts/normalize_manifest.py
            plugins/aquarium/hooks/task_commit_gate.py
            tests/test_inspect_tools.py
            tests/test_task_commit_gate.py
            tests/test_normalize_manifest.py
      - run: git diff --check
