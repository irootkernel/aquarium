version: 2
commands:
  test:
    command: ["make", "test"]
    tags: [full, make, python, ruby]
    parser: generic
    timeout_sec: 3600
  test-prepare:
    command: ["make", "test-prepare"]
    tags: [make, prepare, python, ruby]
    parser: generic
    timeout_sec: 1800
  test-unit:
    command: ["make", "test-unit"]
    tags: [python, unit]
    parser: pytest
    timeout_sec: 1800
  test-int:
    command: ["make", "test-int"]
    tags: [integration, python]
    parser: generic
    timeout_sec: 1800
  test-e2e:
    command: ["make", "test-e2e"]
    tags: [e2e, python]
    parser: pytest
    timeout_sec: 1800
redaction:
  patterns:
    - name: credential-assignment
      regex: '(?i)\b(authorization|api[_-]?key|token|secret|password)=\S+'
      replace: '$1=<redacted>'
    - name: bearer-token
      regex: '(?i)(Bearer)\s+\S+'
      replace: '$1 <redacted>'
